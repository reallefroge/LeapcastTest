name: Leapcast Studio AI - Windows build

on:
  push:
    branches: [ leapcast-studio-ai ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Ensure Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Build app, bundle FFmpeg, build installer
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/build-installer.ps1

      - name: FFmpeg capture capabilities
        shell: pwsh
        run: |
          $ff = Resolve-Path "publish/win-x64/ffmpeg/bin/ffmpeg.exe"
          foreach ($f in 'gfxcapture','ddagrab','scale_d3d11','hwdownload') {
            $t = (& $ff -hide_banner -h "filter=$f" 2>&1 | Out-String)
            $t = $t -replace '%','%25' -replace "`r",'' -replace "`n",'%0A'
            if ($t.Length -gt 3800) { $t = $t.Substring(0,3800) }
            Write-Host "::notice title=filter-$f::$t"
          }

      - name: Engine tests on Windows (bundled FFmpeg, real GDI capture, named pipes)
        shell: pwsh
        run: |
          $env:PATH = (Resolve-Path "publish/win-x64/ffmpeg/bin").Path + ";" + $env:PATH
          $env:LEAPCAST_LOG_COMMANDS = "1"
          New-Item -ItemType Directory -Force smoke | Out-Null
          dotnet run -c Release --project tests/CoreTests 2>&1 | Tee-Object -FilePath smoke/engine-tests.txt
          $code = $LASTEXITCODE
          Get-ChildItem $env:TEMP\leapcast-tests\data\logs -ErrorAction SilentlyContinue | Copy-Item -Destination smoke/ -ErrorAction SilentlyContinue
          Get-ChildItem $env:TEMP\leapcast-tests\*.log -ErrorAction SilentlyContinue | Copy-Item -Destination smoke/ -ErrorAction SilentlyContinue
          # Surface results as annotations (readable without downloading logs)
          Get-Content smoke/engine-tests.txt | Where-Object { $_ -match 'FAIL|engine:|FFmpeg under test|ddagrab|lip|gpu-window|gpu-display|transition-debug|PASS.*(crossfade|gap|GPU)' } |
            Select-Object -First 20 | ForEach-Object { Write-Host "::warning title=engine-test::$($_.Trim())" }
          $ff = Join-Path $env:TEMP "leapcast-tests\data\logs\ffmpeg-last.log"
          if (Test-Path $ff) {
            Get-Content $ff | Select-Object -Skip 1 | Where-Object { $_.Trim() } | Select-Object -Last 8 |
              ForEach-Object { Write-Host "::notice title=ffmpeg-log::$($_.Trim())" }
          }
          if ($code -ne 0) {
            Get-Content smoke/engine-tests.txt | Select-Object -Last 6 | ForEach-Object { Write-Host "::error title=tail::$($_.Trim())" }
            throw "Engine tests failed"
          }

      - name: Portable zip
        shell: pwsh
        run: |
          $v = (Select-Xml -Path src/LeapcastStudioAI/LeapcastStudioAI.csproj -XPath "//Version").Node.InnerText
          Compress-Archive -Path publish/win-x64/* -DestinationPath "dist/LeapcastStudioAI-$v-portable-win-x64.zip" -CompressionLevel Optimal
          Get-ChildItem dist | Format-Table Name, Length

      - name: Smoke test (launch the app, screenshot, check it stays up)
        shell: pwsh
        run: |
          $exe = Resolve-Path "publish/win-x64/Leapcast Studio AI.exe"
          # Demo studio: a game scene + BRB scene, three outputs (Twitch, YouTube, TikTok) and the vertical canvas
          $stateDir = Join-Path $env:LOCALAPPDATA "LeapcastStudioAI"
          New-Item -ItemType Directory -Force $stateDir | Out-Null
          @'
          {
            "Scenes": [
              { "Name": "Wizard101", "Sources": [
                { "Name": "Wizard101 (screen)", "Type": "Display Capture", "CaptureMethod": "GDI", "Anchor": "Fill", "FillMode": "Crop" },
                { "Name": "Title", "Type": "Text", "Text": "Leapcast multistream", "Locked": true, "Anchor": "Free", "X": 0.04, "Y": 0.05, "W": 0 },
                { "Name": "Chat (browser source)", "Type": "Browser", "Hotkey": "Ctrl+Shift+F9", "Anchor": "Free", "X": 0.55, "Y": 0.62, "W": 0, "BrowserWidth": 640, "BrowserHeight": 200, "BrowserFps": 15,
                  "Url": "data:text/html,<html><body><div style='margin:12px;padding:14px 20px;border-radius:14px;background:rgba(87,72,199,0.85);color:rgb(255,255,255);font:600 34px Segoe UI,sans-serif'>Chat: hello from a browser source!</div><div id='t' style='margin:0 12px;color:rgb(255,214,102);font:28px Segoe UI,sans-serif'></div><script>let n=0;setInterval(()=>document.getElementById('t').textContent='live tick '+(n++),500)</script></body></html>" }
              ] },
              { "Name": "Be right back", "Sources": [
                { "Name": "BRB", "Type": "Text", "Text": "Be right back", "Anchor": "Center", "FontSize": 80 }
              ] }
            ],
            "Settings": {
              "VerticalCanvas": true,
              "AutoConfigOffered": true,
              "Outputs": [
                { "Name": "Twitch", "Service": "Twitch", "ServerUrl": "rtmp://live.twitch.tv/app" },
                { "Name": "YouTube", "Service": "YouTube", "ServerUrl": "rtmp://a.rtmp.youtube.com/live2" },
                { "Name": "TikTok", "Service": "TikTok", "ServerUrl": "", "Canvas": "Vertical", "AskKeyEachTime": true }
              ]
            }
          }
          '@ | Set-Content -Encoding utf8 (Join-Path $stateDir "studio-state.json")
          $p = Start-Process -FilePath $exe -ArgumentList "--preview" -PassThru
          Start-Sleep -Seconds 25
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp); $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          New-Item -ItemType Directory -Force smoke | Out-Null
          $bmp.Save("smoke/main-window.png", [System.Drawing.Imaging.ImageFormat]::Png)
          $log = Join-Path $env:LOCALAPPDATA "LeapcastStudioAI\logs\app-errors.log"
          if (Test-Path $log) { Get-Content $log; Copy-Item $log smoke/ }
          if ($p.HasExited) { throw "App exited during startup (code $($p.ExitCode))" }
          Write-Host "App is running after 25 s."
          $p | Stop-Process -Force
          # second launch: the seeded state has become the "Default" profile; open a menu for the screenshot
          if (-not (Test-Path (Join-Path $stateDir "profiles\Default\studio-state.json"))) { throw "The existing state wasn't moved into the Default profile" }
          $p2 = Start-Process -FilePath $exe -ArgumentList "--preview","--demo-menu" -PassThru
          Start-Sleep -Seconds 20
          $bmp2 = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g2 = [System.Drawing.Graphics]::FromImage($bmp2); $g2.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp2.Save("smoke/menu.png", [System.Drawing.Imaging.ImageFormat]::Png)
          if ($p2.HasExited) { throw "App exited on the second launch (code $($p2.ExitCode))" }
          $p2 | Stop-Process -Force

      - uses: actions/upload-artifact@v4
        if: always()
        # the installer is published as a release below; this copy is only a convenience, so a full artifact
        # quota must never block the release
        continue-on-error: true
        with:
          name: LeapcastStudioAI-windows
          path: |
            dist/*
            smoke/*
          if-no-files-found: warn
          retention-days: 3

      - name: Publish pre-release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "studio-ai-build-${{ github.run_number }}"
          gh release create $tag (Get-ChildItem dist/* | ForEach-Object FullName) smoke/main-window.png smoke/menu.png smoke/engine-tests.txt `
            --target ${{ github.sha }} --prerelease --title "Leapcast Studio AI build ${{ github.run_number }}" `
            --notes "Automated Windows build of branch leapcast-studio-ai (${{ github.sha }})."

      - name: Publish diagnostics (failed builds)
        if: failure()
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if (-not (Test-Path smoke)) { exit 0 }
          Compress-Archive -Path smoke/* -DestinationPath diag.zip -Force
          gh release create "studio-ai-diag-${{ github.run_number }}" diag.zip --target ${{ github.sha }} --prerelease `
            --title "Diagnostics for failed build ${{ github.run_number }}" --notes "Logs from a failed CI run."
